name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cover the oldest interface the plugin claims to support and the newest.
        snakemake: ["9.11", "9.13", "9.25", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout
          if [ "${{ matrix.snakemake }}" = "latest" ]; then
            pip install snakemake
          else
            pip install "snakemake~=${{ matrix.snakemake }}"
          fi
          # A PEP 660 editable install is invisible to Snakemake's pkgutil-based
          # plugin discovery, so install a real directory (see README).
          pip install --no-deps -e . --config-settings editable_mode=compat

      - name: Show versions
        run: |
          python -c "import snakemake; print('snakemake', snakemake.__version__)"
          python -c "import snakemake_interface_executor_plugins as m; print('interface', m.__file__)"

      - name: Verify the plugin is discoverable
        run: |
          python -c "
          from snakemake_interface_executor_plugins.registry import ExecutorPluginRegistry
          names = ExecutorPluginRegistry().get_registered_plugins()
          print('registered:', names)
          assert 'shared-local' in names, 'plugin was not discovered'
          "

      - name: Tests
        env:
          # Let coverage see the Snakemake subprocesses the integration tests spawn.
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        run: python -m pytest tests -q --cov=snakemake_executor_plugin_shared_local --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.11.13
      - run: ruff format --check .
      - run: ruff check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
